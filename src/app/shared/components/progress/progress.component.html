<div class="container">
    @if (barOnly) {
        <div class="top">
            <p> {{ current | money:currencyCode:'symbol' }} </p>
            @if(target) {
                <p>/</p> 
                <p>{{ target | money:currencyCode:'symbol' }}</p>}
        </div>    
    }

    @if (current && target) {
        <div class="progress">
            <div 
                class="progress-bar incomplete"
                [ngStyle]="{'width': getProgress()}"
                [class.complete]="current >= target"
            ></div>
            <span class="progress-text"> {{ getProgress() }} </span>
        </div>
    }
</div>
