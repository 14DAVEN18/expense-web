<div class="navbar-container">
    <div class="options">
        @for (tab of navbarTabs; track tab) {
            <div class="option" [routerLink]="tab.path" routerLinkActive="active-option">
                {{ tab.label | translate }}
            </div>
        }
    </div>
    
    <div class="options">
        @for (icon of navbarIcons; track icon) {
            <div 
                class="option icon"
                [routerLink]="icon.path"
                routerLinkActive="active-option"
                [matTooltip]="icon.label | translate"
                [matTooltipPosition]="'before'"
            >
                @if (icon.icon) {
                    <mat-icon> {{ icon.icon }} </mat-icon>
                } @else {
                    {{ icon.label | translate }}
                }
            </div>
        }
    </div>
</div>
