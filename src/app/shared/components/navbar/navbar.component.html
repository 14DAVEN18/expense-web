<div class="navbar-container">
    <div class="options">
        <button mat-icon-button  (click)="toggleDrawer.emit()">
            <mat-icon>menu</mat-icon>
        </button>
    </div>
    
    <div class="options">
        @for (icon of navbarIcons; track icon) {
            <div 
                class="option icon"
                [routerLink]="icon.path"
                routerLinkActive="active-option"
                [matTooltip]="icon.label | translate"
                [matTooltipPosition]="'before'"
            >
                @if (icon.icon) {
                    <mat-icon> {{ icon.icon }} </mat-icon>
                } @else {
                    {{ icon.label | translate }}
                }
            </div>
        }
    </div>
</div>
