<div class="contribution-list-container">
    <div class="header">
        <h1> {{ 'CONTRIBUTIONS.TITLE' | translate }} </h1>

        <div class="actions">
            <button
                mat-mini-fab
                color="primary"
                [matTooltip]="'CONTRIBUTIONS.TOOLTIPS.CREATE' | translate"
                [matTooltipPosition]="'before'"
                (click)="openCreationModal('1000', '1000')"
            >
                <mat-icon>add</mat-icon>
            </button>

            <button
                mat-mini-fab
                color="primary"
                [matTooltip]="'CONTRIBUTIONS.TOOLTIPS.EXPORT' | translate"
                [matTooltipPosition]="'before'"
                (click)="exportCSV()"
            >
                <mat-icon>download</mat-icon>
            </button>
        </div>
    </div>

    <div class="content">
