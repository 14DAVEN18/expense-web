    <div class="administration-container">
        <div class="header">
            <h1>Administration</h1>
        </div>

        <div class="content">
            <our-table-card
                [title]="'ADMINISTRATION.CATEGORIES.TITLE'"
                [columns]="categoryColumns"
                [data]="categories"
                [buttons]="categoryButtons"
                [emptyMessage]="'ADMINISTRATION.CATEGORIES.MESSAGES.EMPTY'"
                [loading]="loadingCategories"
                (action)="actionHandler($event)"
            >
                <ng-template tableCardCell let-row let-column="column">
                    @switch (column.key) {
                        @case ('active') {
                            <div class="flag" [ngClass]="{'active-flag': row.active, 'inactive-flag': !row.active}"></div>
                        }
                        @case ('created_at') {
                            <span>{{ row.created_at | date: 'yyyy/MM/dd' }}</span>
                        }
                        @case ('updated_at') {
                            <span>{{ row.updated_at ? (row.updated_at | date: 'yyyy/MM/dd HH:mm') : '-' }}</span>
                        }
                        @case ('actions') {
                            <div class="actions-container" *ngIf="row.active; else disabledTransaction">
                                <button
                                    mat-mini-fab
                                    color="primary"
                                    [matTooltip]="'ADMINISTRATION.CATEGORIES.TOOLTIPS.EDIT' | translate"
                                    [matTooltipPosition]="'before'"
                                    (click)="openEditionModal('1000', '1000', row)"
                                >
                                    <mat-icon>edit</mat-icon>
                                </button>

                                <button
                                    mat-mini-fab
                                    color="primary"
                                    [matTooltip]="'ADMINISTRATION.CATEGORIES.TOOLTIPS.DELETE' | translate"
                                    [matTooltipPosition]="'before'"
                                    (click)="confirmDeletion( '1000', '1000', row)"
                                >
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </div>
                            <ng-template #disabledTransaction>
                                -
                            </ng-template>
                        }
                        @default {
                            <span> {{ row[column.key] }} </span>
                        }
                    }
                </ng-template>
            </our-table-card>
        </div>
    </div>
