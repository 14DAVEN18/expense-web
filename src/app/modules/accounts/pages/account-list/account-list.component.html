<div class="account-list-container">
    <div class="header">
        <h1> {{ 'ACCOUNTS.TITLE' | translate }} </h1>

        <div class="actions">
            <button 
                mat-mini-fab
                color="primary"
                [matTooltip]="'ACCOUNTS.TOOLTIPS.CREATE' | translate"
                [matTooltipPosition]="'before'"
                (click)="openCreationModal('1000', '1000')"
            >
                <mat-icon>add</mat-icon>
            </button>

            <button 
                mat-mini-fab
                color="primary"
                [matTooltip]="'ACCOUNTS.TOOLTIPS.EXPORT' | translate"
                [matTooltipPosition]="'before'"
                (click)="exportCSV()"
            >
                <mat-icon>download</mat-icon>
            </button>
        </div>
    </div>

    <div class="content">
        @if (!isLoadingAccounts) {
            <div class="filters">
                <our-filters
                    [parameters]="filterParameters"
                    [fixedFilters]="fixedFilters"
                    (filter)="applyFilter($event)"
                    (active)="applyStatus($event)"
                    (search)="applySearch($event)"
                />
            </div>

            <our-table
                [realColumnNames]="realColumnNames"
                [displayHeaders]="displayHeaders"
                [searchColumns]="searchColumns"
                [data]="data"
                [emptyDataColumnName]="shortColumns"
                [noDataColumn]="true"
                [selectedFilter]="selectedFilter"
                [searchValue]="searchValue"
                [active]="showActive"
            >
                <ng-template #cellTemplate let-element='element' let-column="column" let-index="index">
                    <ng-container [ngSwitch]="column">
                        <ng-container *ngSwitchCase="'active'">
                            <div class="flag" [ngClass]="{'active-flag': element.active, 'inactive-flag': !element.active}"></div>
                        </ng-container>

                        <ng-container *ngSwitchCase="'created_at'">
                            <span> {{ element.created_at | date: 'yyyy/MM/dd'}} </span>
                        </ng-container>


                        <ng-container *ngSwitchCase="'initial_balance'">
                            <span> {{ element.current_balance | currency: 'COP' : 'symbol-narrow':'1.2-2' }} </span>
                        </ng-container>

                        <ng-container *ngSwitchCase="'type'">
                            <span> {{ 'ACCOUNT_TYPES.' + element.type | translate }} </span>
                        </ng-container>
                        <ng-container *ngSwitchDefault> {{element[column]}} </ng-container>
                    </ng-container>
                </ng-template>
            </our-table>
        }
        @else {
            <ng-template>
                <div class="loading-message">
                    LOADING ACCOUNTS...
                </div>
            </ng-template>
        }
    </div>
</div>
